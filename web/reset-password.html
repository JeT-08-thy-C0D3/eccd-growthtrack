<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | ECCD GrowthTrack</title>
    <style>
      :root { --navy: #07537a; --green: #2f9d5d; --canvas: #f5fbf9; --border: #bed7cf; --text: #263238; --error: #b3261e; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--canvas); color: var(--text); font-family: Arial, Helvetica, sans-serif; }
      .card { width: min(100%, 460px); background: #fff; border: 1px solid #d3e9e1; border-radius: 24px; padding: 32px; box-shadow: 0 12px 30px rgba(8, 82, 121, .12); }
      .brand { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--navy); font-weight: 700; font-size: 20px; margin-bottom: 28px; }
      .brand img { width: 52px; height: 52px; object-fit: contain; }
      h1 { color: var(--navy); text-align: center; font-size: 28px; margin: 0 0 10px; }
      .intro { text-align: center; line-height: 1.5; margin: 0 0 24px; color: #4d5960; }
      label { display: block; font-size: 13px; font-weight: 700; color: #42545b; margin: 18px 0 7px; }
      input { width: 100%; min-height: 50px; border: 1px solid #9caab0; border-radius: 10px; padding: 12px 14px; font-size: 16px; outline: none; }
      input:focus { border: 2px solid var(--navy); padding: 11px 13px; }
      .hint { color: #64747a; font-size: 12px; margin: 8px 0 0; }
      .message { display: none; margin-top: 18px; border-radius: 10px; padding: 12px; font-size: 14px; line-height: 1.4; }
      .message.error { background: #ffdad6; color: #5f1410; }
      .message.success { background: #d7f5e3; color: #135d34; }
      button { width: 100%; min-height: 52px; margin-top: 24px; border: 0; border-radius: 12px; background: var(--green); color: white; font-size: 17px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 5px rgba(0, 0, 0, .18); }
      button:disabled { cursor: wait; opacity: .7; }
      .back { display: block; text-align: center; margin-top: 20px; color: var(--navy); text-decoration: none; font-weight: 600; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand"><img src="/assets/assets/images/eccd_growthtrack_logo.png" alt="ECCD GrowthTrack logo" />ECCD GrowthTrack</div>
      <section id="reset-content">
        <h1>Verify it’s you</h1>
        <p class="intro" id="account-text">Use the secure link sent to your email to continue.</p>
        <div id="verify-step">
          <button id="verify-button" type="button">Verify it’s me</button>
        </div>
        <form id="reset-form" class="hidden" novalidate>
          <label for="new-password">New Password</label>
          <input id="new-password" type="password" autocomplete="new-password" required />
          <p class="hint">At least 8 characters, with an uppercase letter, lowercase letter, number, and special character (e.g. Password123@). Spaces are not allowed.</p>
          <label for="confirm-password">Confirm Password</label>
          <input id="confirm-password" type="password" autocomplete="new-password" required />
          <div id="message" class="message" role="alert"></div>
          <button id="submit-button" type="submit">Update password</button>
        </form>
      </section>
      <a id="back-link" class="back hidden" href="/?passwordReset=success">Back to login</a>
    </main>
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
      import { getAuth, isSignInWithEmailLink, signInWithEmailLink, updatePassword, verifyPasswordResetCode, confirmPasswordReset, signOut } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';

      const app = initializeApp({ apiKey: 'AIzaSyCL6R3mS0LYOVCv2pGqqir31PC2bMPcEFM', authDomain: 'eccd-growthtrack.firebaseapp.com', projectId: 'eccd-growthtrack' });
      const auth = getAuth(app);
      const params = new URLSearchParams(window.location.search);
      const actionCode = params.get('oobCode');
      const mode = params.get('mode');
      const email = params.get('email') || '';
      const emailLinkRecovery = mode === 'signIn' || (actionCode && email);
      const content = document.getElementById('reset-content');
      const accountText = document.getElementById('account-text');
      const verifyStep = document.getElementById('verify-step');
      const verifyButton = document.getElementById('verify-button');
      const form = document.getElementById('reset-form');
      const message = document.getElementById('message');
      const button = document.getElementById('submit-button');
      const backLink = document.getElementById('back-link');

      function showMessage(text, type) { message.textContent = text; message.className = `message ${type}`; message.style.display = 'block'; }
      function showExpired(messageText) { content.innerHTML = `<h1>Link unavailable</h1><p class="intro">${messageText}</p>`; backLink.classList.remove('hidden'); }

      if (!actionCode || (!emailLinkRecovery && mode !== 'resetPassword')) {
        showExpired('This password reset link is invalid. Request a new link from the login page.');
      }

      verifyButton.addEventListener('click', async () => {
        verifyButton.disabled = true;
        verifyButton.textContent = 'Verifying...';
        try {
          const signInLink = new URL(window.location.href);
          // Recent Firebase email-link URLs can omit mode=signIn. The SDK's
          // parser still needs that marker to recognise the one-time code.
          if (emailLinkRecovery && !signInLink.searchParams.has('mode')) {
            signInLink.searchParams.set('mode', 'signIn');
          }
          const verifiedEmail = emailLinkRecovery
            ? (await signInWithEmailLink(auth, email, signInLink.toString())).user?.email
            : await verifyPasswordResetCode(auth, actionCode);
          if (!verifiedEmail) throw new Error('Unable to verify email.');
          content.querySelector('h1').textContent = 'Create new password';
          accountText.textContent = `Verified for ${verifiedEmail}. Create your new password.`;
          verifyStep.classList.add('hidden');
          form.classList.remove('hidden');
          document.getElementById('new-password').focus();
        } catch (_) {
          showExpired('This password reset link is invalid or has expired. Request a new link from the login page.');
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        if (newPassword.length < 8) return showMessage('Password must be at least 8 characters.', 'error');
        if (/\s/.test(newPassword)) return showMessage('Password must not contain spaces.', 'error');
        if (!/[A-Z]/.test(newPassword)) return showMessage('Password must include an uppercase letter.', 'error');
        if (!/[a-z]/.test(newPassword)) return showMessage('Password must include a lowercase letter.', 'error');
        if (!/\d/.test(newPassword)) return showMessage('Password must include a number.', 'error');
        if (!/[^A-Za-z0-9]/.test(newPassword)) return showMessage('Password must include a special character.', 'error');
        if (newPassword !== confirmPassword) return showMessage('New Password and Confirm Password do not match.', 'error');
        button.disabled = true;
        button.textContent = 'Updating password...';
        try {
          if (emailLinkRecovery) {
            if (!auth.currentUser) throw new Error('Verification expired.');
            await updatePassword(auth.currentUser, newPassword);
            await signOut(auth);
          } else {
            await confirmPasswordReset(auth, actionCode, newPassword);
          }
          content.innerHTML = '<h1>Password changed</h1><p class="intro">Your password was updated successfully. Returning you to login…</p>';
          setTimeout(() => window.location.replace('/?passwordReset=success'), 1200);
        } catch (_) {
          showMessage('Unable to update the password. The link may have expired. Request a new reset link and try again.', 'error');
          button.disabled = false;
          button.textContent = 'Update password';
        }
      });
    </script>
  </body>
</html>
